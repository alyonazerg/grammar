<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Lab · Teacher</title><style>:root{--ink:#172126;--paper:#f6f2e9;--card:#fffdf8;--accent:#df6b4f;--sage:#8aa398;--line:#d9d1c5;--muted:#687376}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:30px 22px}h1,h2,h3{font-family:Georgia,serif}h1{font-size:clamp(2.6rem,7vw,5rem);line-height:.9;margin:.2em 0}.tag{color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-weight:800;font-size:.72rem}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 8px 28px #1721260a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric strong{display:block;font:700 2rem/1 Georgia,serif}.btn{border:0;border-radius:999px;background:var(--ink);color:white;padding:11px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}input,select{padding:11px;border:1px solid var(--line);border-radius:11px;font:inherit;background:white}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.nav button.active{background:var(--accent)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#e7f0e9}.login{max-width:480px;margin:9vh auto}.warn{color:#9b452f;font-weight:700}[hidden]{display:none!important}</style></head><body><main><section id="login" class="card login"><span class="tag">Teacher access</span><h1>Grammar<br>Lab</h1><p class="muted">Sign in with the teacher account.</p><form id="loginform"><label>Email<br><input id="email" type="email" autocomplete="username" value="alyonazerg@gmail.com" style="width:100%"></label><br><label>Password<br><input id="password" type="password" autocomplete="current-password" style="width:100%"></label><p><button id="signinbtn" class="btn" type="submit">Sign in</button></p><p id="loginerr" class="warn"></p></form></section><section id="dash" hidden><span class="tag">Teacher dashboard</span><h1>Grammar Lab</h1><div class="nav"><button class="btn active">Overview</button><button class="btn secondary">Groups</button><button class="btn secondary">Students</button><button class="btn secondary">Topics</button><button class="btn secondary">Skills</button><button class="btn secondary" onclick="signOut()">Sign out</button></div><section class="card"><span class="tag">Topic 1 · Live session</span><h2>Timer control</h2><div class="controls"><label>Base time <input id="minutes" type="number" min="1" max="240" value="35" style="width:80px"> min</label><button class="btn" onclick="setLimit()">Set</button><button class="btn secondary" onclick="addTime(60)">+1 min</button><button class="btn secondary" onclick="addTime(300)">+5 min</button><button class="btn secondary" onclick="addTime(600)">+10 min</button><button class="btn secondary" onclick="resetExtra()">Reset extra</button></div><p id="timerstate" class="muted">Loading timer…</p></section><div id="metrics" class="grid"></div><section class="card"><div class="controls"><h2 style="margin-right:auto">Attempts</h2><select id="groupfilter" onchange="renderAttempts()"><option value="">All groups</option><option>150</option><option>151</option><option>154</option></select></div><div style="overflow:auto"><table><thead><tr><th>Student</th><th>Group</th><th>Topic</th><th>Score</th><th>%</th><th>Time</th><th>Submitted</th></tr></thead><tbody id="attempts"></tbody></table></div></section></section></main><script src="../topic1/config.js?v=20261004"></script><script src="app.js?v=20261004-2"></script></body></html>
