<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topic 1 · Grammar Lab</title><style>:root{--ink:#182126;--paper:#f5f1e8;--card:#fffdf8;--accent:#d9694e;--line:#d8d0c3;--muted:#697477;--green:#e8f1ec;--red:#f8e5df}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}main,header{max-width:980px;margin:auto;padding:34px 22px}h1,h2,h3{font-family:Georgia,serif}h1{font-size:clamp(2.8rem,8vw,5.8rem);line-height:.92;margin:.2em 0}.kicker,.tag{color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-weight:800;font-size:.75rem}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin:16px 0;box-shadow:0 8px 28px #1721260b}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field label{display:block;font-weight:750;margin-bottom:6px}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit}.btn{border:0;border-radius:999px;background:var(--ink);color:white;padding:12px 18px;font-weight:800;cursor:pointer}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.hidden{display:none!important}.progress{height:8px;background:#e5ded2;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:.2s}.prompt{font-size:1.15rem;font-weight:750;padding:15px 18px;border-left:4px solid var(--accent);background:#fff7f0}.options{display:grid;gap:9px;margin-top:14px}.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:13px;background:white}.sectionTitle{display:flex;justify-content:space-between;gap:15px;align-items:end}.theory{background:#eef1ed;border-radius:16px;padding:18px;margin:14px 0}.review.good{background:var(--green)}.review.bad{background:var(--red)}.pill{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:99px;font-size:.8rem;margin:3px}.pair{font-size:1.08rem;border-left:4px solid var(--accent);padding-left:16px}.warn{color:#9b452f;font-weight:750}@media(max-width:600px){.card{padding:18px}}</style></head><body><header><div class="kicker">First-year Linguistics · Topic 1</div><h1>Grammar<br>Lab</h1><p class="muted">Noun · possession · article. Individual diagnostic first; English-only pair work after submission.</p></header><main><section id="start" class="card"><span class="tag">Start</span><h2>Who are you?</h2><div class="grid"><div class="field"><label>First name + surname</label><input id="name" placeholder="Ivan Ivanov"></div><div class="field"><label>Group</label><select id="group"><option value="">Choose…</option><option>150</option><option>151</option><option>154</option></select></div></div><p class="muted">Use the format <b>Ivan Ivanov</b>. Discussing questions is allowed only after both partners have submitted — and in English only.</p><button class="btn" onclick="begin()">Start diagnostic</button><p id="startErr" class="warn"></p></section><section id="test" class="hidden"><div class="card"><div class="sectionTitle"><div><span class="tag" id="secTag"></span><h2 id="secTitle"></h2></div><b id="counter"></b></div><div class="progress"><div id="bar"></div></div></div><div id="question"></div><div style="display:flex;justify-content:space-between;gap:10px"><button class="btn secondary" onclick="prev()">← Back</button><button class="btn" onclick="next()" id="nextBtn">Next →</button></div></section><section id="result" class="hidden"></section></main><script>
const Q=[
// NOUN X-RAY: multi-feature items
{sec:'Noun X-Ray',skill:'noun.classification',type:'multi',p:'Analyse “police” in: The police are investigating the case.',opts:['common noun','proper noun','collective noun','class noun','abstract noun','plural meaning/agreement','singular meaning/agreement','common case','genitive case'],a:['common noun','collective noun','plural meaning/agreement','common case'],why:'Police is a common collective noun denoting a group; in this use it takes plural agreement and is in the common case.',ref:'Kaushanskaya, Ch. I §§5–7'},
{sec:'Noun X-Ray',skill:'noun.classification',type:'multi',p:'Analyse “kindness” in: Her kindness surprised everyone.',opts:['common noun','proper noun','abstract noun','material noun','singular','plural','common case','genitive case','simple noun','derivative noun'],a:['common noun','abstract noun','singular','common case','derivative noun'],why:'Kindness names an abstract quality; -ness forms a derivative noun.',ref:'Kaushanskaya, Ch. I §§4–7'},
{sec:'Noun X-Ray',skill:'noun.case',type:'multi',p:'Analyse “students’” in: The students’ essays were excellent.',opts:['common noun','proper noun','class noun','collective noun','singular','plural','common case','genitive case','attribute','subject'],a:['common noun','class noun','plural','genitive case','attribute'],why:'Students’ is a plural class noun in the genitive case functioning as an attribute to essays.',ref:'Kaushanskaya, Ch. I §§5–7'},
{sec:'Noun X-Ray',skill:'noun.number',type:'multi',p:'Analyse “news” in: The news is surprising.',opts:['common noun','abstract noun','class noun','singular agreement','plural agreement','singularia tantum','pluralia tantum','common case'],a:['common noun','abstract noun','singular agreement','singularia tantum','common case'],why:'News has an -s ending but normally takes singular agreement and is treated as singularia tantum.',ref:'Kaushanskaya, Ch. I §6'},
{sec:'Noun X-Ray',skill:'noun.number',type:'single',p:'Choose the correct plural: mother-in-law',opts:['mother-in-laws','mothers-in-law','mothers-in-laws'],a:'mothers-in-law',why:'In this compound the head noun mother takes the plural.',ref:'Kaushanskaya, Ch. I §6'},
{sec:'Noun X-Ray',skill:'noun.number',type:'single',p:'Which sentence has correct agreement?',opts:['The committee has reached its decision.','The committee have reached its decision, and every member agrees.','The news are encouraging.'],a:'The committee has reached its decision.',why:'A collective noun may be treated as a unit; news takes singular agreement.',ref:'Kaushanskaya, Ch. I §§5–6'},
// POSSESSION
{sec:'Possession',skill:'noun.genitive',type:'single',p:'Which statement best describes “a car’s engine” and “the engine of a car”?',opts:['Only the of-phrase is grammatical because car is inanimate.','Both can occur; context, conventionality and information structure influence the choice.','Only the ’s-genitive is grammatical.'],a:'Both can occur; context, conventionality and information structure influence the choice.',why:'The animate/inanimate contrast is a tendency, not an absolute ban. Inanimate nouns can readily occur in the genitive.',ref:'Kaushanskaya, Ch. I §7'},
{sec:'Possession',skill:'possession.of_phrase',type:'single',p:'Which is strongly preferred?',opts:['yesterday’s meeting','the meeting of yesterday','both are equally neutral'],a:'yesterday’s meeting',why:'Time expressions strongly favour the genitive.',ref:'Kaushanskaya, Ch. I §7'},
{sec:'Possession',skill:'possession.pronouns',type:'single',p:'In “This umbrella is hers”, what is hers?',opts:['possessive determiner (traditional: possessive adjective)','possessive pronoun','genitive case of a noun'],a:'possessive pronoun',why:'Hers stands independently; compare her umbrella, where her is a possessive determiner.',ref:'Possessive forms — consolidation'},
{sec:'Possession',skill:'noun.genitive_independent',type:'single',p:'In “My essay was longer than Daniel’s”, Daniel’s is…',opts:['an independent/absolute genitive with elliptical use','a possessive pronoun','an of-phrase'],a:'an independent/absolute genitive with elliptical use',why:'The genitive stands independently and the repeated head noun essay is understood.',ref:'Kaushanskaya, Ch. I §7'},
{sec:'Possession',skill:'noun.genitive_local',type:'single',p:'In “We are having dinner at Sarah’s”, Sarah’s illustrates…',opts:['local use of the independent/absolute genitive','double genitive','possessive determiner'],a:'local use of the independent/absolute genitive',why:'A place noun such as house/home is conventionally understood.',ref:'Kaushanskaya, Ch. I §7'},
{sec:'Double Genitive',skill:'possession.double_genitive',type:'theory',p:'DOUBLE GENITIVE',theory:'Pattern: a/an, this/that, some etc. + noun + OF + independent possessive/genitive. Examples: a friend of mine; that colleague of Anna’s. It commonly presents one member of a set. Do not confuse it with an ordinary of-phrase: the roof of the house.'},
{sec:'Double Genitive',skill:'possession.double_genitive',type:'single',p:'Which is a double genitive?',opts:['a friend of mine','the roof of the house','my friend'],a:'a friend of mine',why:'It combines of with an independent possessive form.',ref:'Possession — consolidation'},
{sec:'Double Genitive',skill:'possession.double_genitive',type:'multi',p:'Select ALL acceptable double-genitive patterns.',opts:['a colleague of my father’s','that idea of Sarah’s','a friend of me','some students of our teacher’s','the colour of the wall'],a:['a colleague of my father’s','that idea of Sarah’s','some students of our teacher’s'],why:'The complement after of is an independent possessive/genitive, not an objective pronoun such as me.',ref:'Possession — consolidation'},
// ARTICLES
{sec:'Article Logic',skill:'article.system',type:'single',p:'___ coffee keeps me awake. Meaning: coffee as a substance/category in general.',opts:['Ø','the','a'],a:'Ø',why:'A material noun in general reference normally has no article.',ref:'Kaushanskaya, Ch. II §§5–7'},
{sec:'Article Logic',skill:'article.material',type:'single',p:'Could I have ___ coffee, please? Meaning: one serving.',opts:['Ø','the','a'],a:'a',why:'The material noun is used countably to mean one serving.',ref:'Kaushanskaya, Ch. II §§5–7'},
{sec:'Article Logic',skill:'article.material',type:'single',p:'___ coffee you made is excellent.',opts:['Ø','the','a'],a:'the',why:'The clause you made identifies a particular quantity of coffee.',ref:'Kaushanskaya, Ch. II §§5–7'},
{sec:'Article Logic',skill:'article.abstract',type:'single',p:'Choose the best explanation: “Kindness is important” → “She did me a kindness.”',opts:['Kindness changes from an abstract quality in general to a particular example/act.','The second sentence is ungrammatical.','The noun becomes a proper noun.'],a:'Kindness changes from an abstract quality in general to a particular example/act.',why:'An abstract noun may become countable when it denotes a particular example or act.',ref:'Kaushanskaya, Ch. II §§8–11'},
{sec:'Special Articles',skill:'article.special',type:'single',p:'She went to ___ university at eighteen. Meaning: she became a university student.',opts:['Ø','the','a'],a:'Ø',why:'University is used in its institutional/primary-function meaning.',ref:'Kaushanskaya, Ch. II §28'},
{sec:'Special Articles',skill:'article.special',type:'single',p:'I went to ___ university to pick up my sister. Meaning: a particular university building/institution already identifiable in context.',opts:['Ø','the','a'],a:'the',why:'Here the reference is to a particular identifiable place, not the institutional activity.',ref:'Kaushanskaya, Ch. II §28'},
{sec:'Special Articles',skill:'article.special',type:'single',p:'Which is the normal general expression?',opts:['Breakfast is ready.','The breakfast is ready.','A breakfast is ready.'],a:'Breakfast is ready.',why:'Names of meals normally take no article in general use.',ref:'Kaushanskaya, Ch. II §30'},
{sec:'Special Articles',skill:'article.proper',type:'single',p:'Choose the correct form.',opts:['the Thames','Thames','a Thames'],a:'the Thames',why:'Names of rivers take the definite article.',ref:'Kaushanskaya, Ch. II §13'},
// FEW/LITTLE + NEXT
{sec:'Reference',skill:'article.few_little',type:'single',p:'I have ___ close friends here, so I’m not lonely.',opts:['few','a few','the few'],a:'a few',why:'A few = some/a small number, with a positive or neutral implication.',ref:'Kaushanskaya, Ch. II §33'},
{sec:'Reference',skill:'article.few_little',type:'single',p:'___ students understood the explanation; we need to teach it again.',opts:['Few','A few','The few'],a:'Few',why:'Few = not many, with emphasis on insufficiency.',ref:'Kaushanskaya, Ch. II §33'},
{sec:'Reference',skill:'article.few_little',type:'single',p:'___ students who stayed after class asked very thoughtful questions.',opts:['Few','A few','The few'],a:'The few',why:'The few = the small identifiable number that exists/is being referred to.',ref:'Kaushanskaya, Ch. II §33'},
{sec:'Reference',skill:'article.few_little',type:'single',p:'We still have ___ time, so we can check one more example.',opts:['little','a little','the little'],a:'a little',why:'A little = some/a small amount, enough to be useful.',ref:'Kaushanskaya, Ch. II §33'},
{sec:'Reference',skill:'article.few_little',type:'single',p:'There is ___ hope of finishing today.',opts:['little','a little','the little'],a:'little',why:'Little = not much, with emphasis on insufficiency.',ref:'Kaushanskaya, Ch. II §33'},
{sec:'Reference',skill:'article.next',type:'single',p:'I’ll see you ___ week.',opts:['next','the next','a next'],a:'next',why:'Next week is normally deictic: the week after the present one.',ref:'Kaushanskaya, Ch. II §38'},
{sec:'Reference',skill:'article.next',type:'single',p:'He arrived on Monday and spent ___ week preparing for the exam.',opts:['next','the next','a next'],a:'the next',why:'The next week means the following seven-day period relative to an already established point in the narrative.',ref:'Kaushanskaya, Ch. II §38'},
{sec:'Reference',skill:'article.next',type:'single',p:'“I’ll finish it next week,” she said. Choose the standard reported-speech transformation.',opts:['She said she would finish it the following week.','She said she would finish it next week in every context.','She said she would finish it a following week.'],a:'She said she would finish it the following week.',why:'The article is not required by reported speech itself. The time reference shifts from the speaker’s “now” to a specific following period relative to the reporting point.',ref:'Kaushanskaya, Ch. II §38 + reported-speech time reference'}
];
let i=0,answers={},started=null,student={};const scored=Q.filter(x=>x.type!=='theory');
function begin(){const n=document.getElementById('name').value.trim().replace(/\s+/g,' '),g=document.getElementById('group').value;if(n.split(' ').length<2){startErr.textContent='Please use first name + surname, e.g. Ivan Ivanov.';return}if(!g){startErr.textContent='Choose your group.';return}student={name:n,group:g};started=new Date().toISOString();start.classList.add('hidden');test.classList.remove('hidden');render()}
function render(){const q=Q[i];secTag.textContent=`${i+1} / ${Q.length}`;secTitle.textContent=q.sec;counter.textContent=q.type==='theory'?'Read → then continue':'';bar.style.width=((i+1)/Q.length*100)+'%';let html=`<div class="card"><div class="prompt">${q.p}</div>`;if(q.type==='theory'){html+=`<div class="theory"><b>Read before you continue</b><p>${q.theory}</p></div>`}else{html+=`<div class="options">${q.opts.map(o=>`<label class="opt"><input type="${q.type==='multi'?'checkbox':'radio'}" name="q" value="${esc(o)}" ${selected(q,o)?'checked':''} onchange="save()"><span>${o}</span></label>`).join('')}</div>`}html+='</div>';question.innerHTML=html;nextBtn.textContent=i===Q.length-1?'Submit diagnostic':'Next →'}
function esc(s){return s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')};function selected(q,o){const a=answers[i];return q.type==='multi'?Array.isArray(a)&&a.includes(o):a===o}function save(){const q=Q[i];if(q.type==='multi')answers[i]=[...document.querySelectorAll('input[name=q]:checked')].map(x=>x.value).sort();else answers[i]=document.querySelector('input[name=q]:checked')?.value||null}function prev(){save();if(i>0){i--;render()}}function next(){save();const q=Q[i];if(q.type!=='theory'&&(answers[i]==null||(Array.isArray(answers[i])&&answers[i].length===0))){alert('Choose an answer before continuing.');return}if(i<Q.length-1){i++;render()}else finish()}
function same(a,b){if(Array.isArray(b))return JSON.stringify([...(a||[])].sort())===JSON.stringify([...b].sort());return a===b}
function finish(){let ok=0,by={};scored.forEach((q,idx)=>{const qi=Q.indexOf(q),good=same(answers[qi],q.a);if(good)ok++;by[q.skill]??={ok:0,n:0,ref:q.ref};by[q.skill].n++;if(good)by[q.skill].ok++});const pct=Math.round(ok/scored.length*100);test.classList.add('hidden');result.classList.remove('hidden');const weak=Object.entries(by).filter(([k,v])=>v.ok/v.n<.75).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n);const pair=pairCards().slice(0,2);result.innerHTML=`<div class="card"><span class="tag">Submitted locally</span><h2>${student.name} · ${student.group}</h2><h1 style="font-size:4rem">${pct}%</h1><p>${ok} / ${scored.length} scored items correct.</p><p class="warn">Database saving will switch on after the assessment questions are seeded in Supabase. Your answers are currently evaluated in this browser.</p></div><div class="card"><span class="tag">Revision plan</span><h2>What to repeat</h2>${weak.length?weak.slice(0,5).map(([k,v])=>`<p><b>${label(k)}</b> — ${Math.round(v.ok/v.n*100)}%<br><span class="muted">Review: ${v.ref}</span></p>`).join(''):'<p>Strong result across the tested areas. Review the explanations below for precision.</p>'}</div><div class="card"><span class="tag">Pair work · English only</span><h2>When both of you are free</h2><p>You may discuss the grammar together, but use <b>English only</b>. Your teacher may check either card.</p>${pair.map((x,j)=>`<div class="pair"><b>Card ${j+1}</b><p>${x}</p></div>`).join('')}</div><div class="card"><span class="tag">Answer review</span><h2>Correct answers & explanations</h2>${scored.map(q=>{const qi=Q.indexOf(q),good=same(answers[qi],q.a);return `<div class="card review ${good?'good':'bad'}"><b>${q.p}</b><p>Your answer: ${fmt(answers[qi])}<br>Correct: <b>${fmt(q.a)}</b></p><p>${q.why}</p><small>${q.ref}</small></div>`}).join('')}</div>`;window.scrollTo(0,0)}
function fmt(x){return Array.isArray(x)?x.join(' · '):(x??'—')}function label(k){return ({'noun.classification':'Noun classification','noun.number':'Category of number','noun.case':'Category of case','noun.genitive':'Genitive case','possession.of_phrase':'Genitive vs of-phrase','possession.pronouns':'Possessive forms','noun.genitive_independent':'Independent / absolute genitive','noun.genitive_local':'Local genitive','possession.double_genitive':'Double genitive','article.system':'Article system','article.material':'Material nouns','article.abstract':'Abstract nouns','article.special':'Special article uses','article.proper':'Proper nouns','article.few_little':'few / a few / the few; little / a little / the little','article.next':'next / the next'})[k]||k}
function pairCards(){return shuffle(["Find an object in the room. Describe one relationship twice: first with an ’s-genitive, then with an of-phrase. Decide whether both versions are natural and explain why.","Explain the difference between a possessive determiner and a possessive pronoun. Give two examples of each.","Create one example of an elliptical independent genitive and one local genitive. Your partner identifies which is which.","Create two acceptable double genitives and one tempting but incorrect form. Your partner finds the incorrect one and explains it.","Choose an abstract noun such as experience, kindness or success. Create two contexts that change its article/countability behaviour.","Create a mini-context contrasting few / a few / the few OR little / a little / the little. Your partner explains the meaning difference.","Create one sentence with next week and one with the next week. Explain where the reference point is in each.","Choose a noun in the classroom and give as complete a grammatical profile as possible: class, number, case, composition and syntactic function."])}function shuffle(a){return a.sort(()=>Math.random()-.5)}
</script></body></html>
